version: '3.8'
services:
  db:
    image: postgres:15.3-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=go-battle
    ports:
      - '5432:5432'

  api:
    depends_on:
      - db
    build:
      context: ./go-battle
      dockerfile: api.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./go-battle:/usr/src/app
    command: air -c .air.toml

  cerveau:
    build:
      context: ./cerveau
      dockerfile: Dockerfile
    volumes:
      - ./cerveau:/cerveau:delegated
      - /cerveau/node_modules
    ports:
      - "3002:3000"
      - "3080:3080"
      - "3088:3088"

  viseur:
    build:
      context: ./viseur
      dockerfile: prod.Dockerfile
    volumes:
      - ./viseur:/vis:delegated
      - /vis/node_modules
    ports:
      - "8080:8080"

  web:
    build:
      dockerfile: ./go-battle-web/prod.Dockerfile
      args:
        - VITE_CERVEAU_WS_SERVER=ws.cerveau.simington.io
        - VITE_CERVEAU_WS_PORT=443
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - WATCHPACK_POLLING=true
    volumes:
      - ./go-battle-web:/usr/src/app/go-battle-web:delegated
      - web-node-modules:/usr/src/app/go-battle-web/node_modules

volumes:
  db:
    driver: local
  web-node-modules:
    driver: local

networks:
  localnet:
